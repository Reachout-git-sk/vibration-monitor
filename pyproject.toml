[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vibmon"
version = "0.1.0"
description = "Desktop vibration monitor for a serial vibration controller or sensor node"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6",
    "pyserial>=3.5",
    "pyqtgraph>=0.13",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-qt>=4.4", "pillow>=10"]

[project.scripts]
vibmon-sim = "vibmon.simulator:main"

[project.gui-scripts]
vibmon = "vibmon.app:main"

[tool.setuptools]
packages = ["vibmon"]
